# Каркас обучения. Меняйте контент и вопросы здесь — код трогать не нужно.
# type: content -> видео или скрипт с кнопкой "я посмотрел/изучил" (опционально + quiz)
# type: confirm -> вопрос да/нет
# type: quiz    -> отдельный блок вопросов (не привязан к конкретному видео/скрипту)

steps:
  - id: video_1
    type: content
    kind: video
    title: "Видео 1: Презентация работы"
    file_id: ""
    url: "https://rutube.ru/video/private/6cce49b49e26921a75d62977dc8b85dc/?p=AilF69vzwXpunE94xyCGRQ"
    confirm_button: "✅ Я посмотрел"
    quiz:
      pass_rule: all_correct
      questions:
        - question: "В чём заключается работа удалённого агента?"
          options:
            - "Искать арендаторов через объявления и показывать им квартиры"
            - "Обзванивать собственников по готовой базе и договариваться с ними о том, чтобы они работали именно с нашим агентством"
            - "Самостоятельно искать номера собственников в интернете"
            - "Фотографировать квартиры и оформлять договоры аренды"
          correct_index: 1

  - id: video_2
    type: content
    kind: video
    title: "Видео 2: Мини-курс"
    file_id: ""
    url: "https://rutube.ru/video/private/bab64da5c3715fb66f68f338eec84552/?p=51jnPvjfHn4nyZr0ORWAAA"
    confirm_button: "✅ Я посмотрел"
    quiz:
      pass_rule: all_correct
      questions:
        - question: "Где заканчивается ответственность удалённого агента?"
          options:
            - "После того как арендатор заселился в квартиру"
            - "После подписания договора аренды с арендатором"
            - "После того как договорился с собственником и грамотно передал его коллеге"
            - "Ответственность не заканчивается — агент сам ведёт сделку до конца"
          correct_index: 2

  - id: script_1
    type: content
    kind: reading
    title: "Скрипт короткий"
    file_id: "BQACAgIAAxkDAANQapUVD-SXdl7_FdVOoqN9ECrUu-MAApmgAAI_UqhIL1Ym1EkbOY49BA"
    confirm_button: "Я ознакомился"
    quiz: null   # тест по всем 4 скриптам общий, идёт отдельным шагом ниже

  - id: script_2
    type: content
    kind: reading
    title: "Скрипт развёрнутый"
    file_id: "BQACAgIAAxkDAANRapUVEBTRYBmIfNB_d2G1BZgknkYAApqgAAI_UqhINakyEeeJwFg9BA"
    confirm_button: "Я ознакомился"
    quiz: null

  - id: script_3
    type: content
    kind: reading
    title: "Почему собственники отказывают"
    file_id: "BQACAgIAAxkDAANSapUVENYN4RNStDAOVwGRmZX9OkMAApugAAI_UqhIc0D7xX8uF5g9BA"
    confirm_button: "Я ознакомился"
    quiz: null

  - id: script_4
    type: content
    kind: reading
    title: "Косвенные возражения"
    file_id: "BQACAgIAAxkDAANTapUVIuMIqt784K2tZeP1fN3aldsAApygAAI_UqhIy4a0Q5-NVYY9BA"
    confirm_button: "Я ознакомился"
    quiz: null

  - id: scripts_quiz
    type: quiz
    title: "Тест по 4 скриптам"
    min_correct: 3   # из 4 — поменяйте на pass_rule: all_correct, если нужны все верно
    questions:
      - question: "Зачем нужно попросить собственника временно закрыть (заархивировать) объявление?"
        options:
          - "Чтобы у собственника не осталось доказательств размещения"
          - "Чтобы конкуренты не сделали дубли объявления с заниженной ценой и не сорвали доверие клиента к сделке"
          - "Это обязательное требование Авито и Циан при работе с агентством"
        correct_index: 1
      - question: "Кто по итогу платит комиссию агентству?"
        options:
          - "Собственник квартиры"
          - "Арендатор (жилец)"
          - "Комиссию делят поровну собственник и арендатор"
        correct_index: 1
      - question: "Какая общая схема ответа на возражение собственника (материал «Почему собственники отказывают»)?"
        options:
          - "Сначала переубедить, что он неправ, а потом настоять на своём"
          - "Признать опасение → показать, что риск не на стороне собственника → вернуть ему контроль над ситуацией"
          - "Согласиться с отказом и сразу закрыть заявку"
        correct_index: 1
      - question: "Собственник говорит: «Не хочу разговаривать с разными людьми — почему сначала вы, потом коллега?» Как правильно ответить?"
        options:
          - "Извиниться и сразу переключить разговор на коллегу"
          - "Объяснить разделение ролей: агент координирует и согласует условия по телефону, коллега лично работает с клиентами и показами — все договорённости коллеге передаются полностью, повторять не придётся"
          - "Сказать, что это не важно, и сменить тему"
        correct_index: 1

  - id: ready_check
    type: confirm
    title: "Вы уверены, что готовы приступать к звонкам?"
    yes_button: "Да, я готов(а) приступать"
    no_button: "Пройти обучение заново"
    on_no: restart   # при "нет" сбрасывает прогресс и начинает с video_1

