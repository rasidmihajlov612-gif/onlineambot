    button: "\U0001F3E2 Открыть онлайн-офис"
    text: >-
      🏢 <b>Онлайн-офис</b>


      Здесь всё по работе: обучение, чек-лист старта, передача объектов,
      финансы и связь с куратором.


      Сообщение закреплено — офис всегда под рукой, искать в переписке не нужно.
