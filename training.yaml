# Автоочистка неактивных агентов (прошедших обучение, но давно ничего не
# передававших). Активность = дата допуска или дата последнего переданного
# объекта — смотря что позже.
activity:
  inactive_after_days: 7    # столько дней без активности — присылаем предупреждение админу
  grace_period_days: 2      # столько дней ждём ответа "Оставить активным", потом кикаем и удаляем
  check_interval_hours: 6   # как часто бот проверяет базу

# Ставки за объекты. Начисляется сразу в момент события (принята/сдана),
# слетевший объект деньги за "принята" не отбирает. Выплаты — по пятницам,
# вручную через /kv.
payments:
  accepted_rate: 500   # начисляется, как только куратор нажал "В работу"
  closed_rate: 2000    # начисляется дополнительно, когда объект отмечен "Сдано"

# Контент мини-аппа (раздел "Начало работы" и "Поддержка") — правьте текст здесь, код трогать не нужно
webapp:
  # Закреплённое сообщение в личке агента со ссылкой на мини-апп.
  # Бот ставит его при /start и по админской команде /pinoffice.
