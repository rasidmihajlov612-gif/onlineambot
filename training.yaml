    - "Распечатайте скрипты (именно белые из закрепа канала)"
    - "Если объект требует срочного вмешательства — не ждите ответа по заявке о передаче, сразу звоните куратору и закрывайте объект как можно скорее"
  support_info: >-
    Если собственник задаёт вопрос, на который нет ответа в скриптах — не додумывайте
