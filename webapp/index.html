<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>АМ — обучение и работа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="app">
  <header class="app-header">
    <div class="eyebrow">АМ · МИНИ-АПП</div>
    <h1>Агентство Андрея Медведева</h1>
  </header>

  <main id="tab-content"></main>

  <!-- compact: шесть кнопок вместо пяти, иконки и подписи мельче, иначе
       "Поддержка" не влезает в 62px на экране 360px -->
  <nav class="tab-bar compact">
    <button class="tab-btn active" data-tab="training"><span class="icon">🎓</span><span>Обучение</span></button>
    <button class="tab-btn" data-tab="practice"><span class="icon">🎧</span><span>Практика</span></button>
    <button class="tab-btn" data-tab="start"><span class="icon">✅</span><span>Начало</span></button>
    <button class="tab-btn" data-tab="handoff"><span class="icon">🏠</span><span>Объекты</span></button>
    <button class="tab-btn" data-tab="finances"><span class="icon">💰</span><span>Финансы</span></button>
    <button class="tab-btn" data-tab="support"><span class="icon">💬</span><span>Поддержка</span></button>
  </nav>
</div>

<script src="/static/app.js"></script>
</body>
</html>
