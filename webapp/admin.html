<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>АМ — панель куратора</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="app">
  <header class="app-header">
    <div class="eyebrow">АМ · ПАНЕЛЬ КУРАТОРА</div>
    <h1 id="admin-title">Вход</h1>
  </header>

  <main id="admin-content"></main>

  <!-- Показывается только после ввода PIN — до входа показывать нечего -->
  <nav class="tab-bar" id="admin-tabs" hidden>
    <button class="tab-btn active" data-tab="money">
      <span class="icon">💰</span><span>Деньги</span>
    </button>
    <button class="tab-btn" data-tab="bans">
      <span class="icon">🚫</span><span>Баны</span>
    </button>
    <button class="tab-btn" data-tab="flats">
      <span class="icon">🏠</span><span>Квартиры</span>
    </button>
    <button class="tab-btn" data-tab="training">
      <span class="icon">🎧</span><span>Тренировки</span>
    </button>
  </nav>
</div>

<script src="/static/admin.js"></script>
</body>
</html>
